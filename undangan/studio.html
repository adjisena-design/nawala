<!-- The Studio (owner, 27 Nov 2026): the slot editor for Dasar invitations.
     The theme stays locked. A couple changes only what the theme opens, in three ways:
       Sentuh  tap one slot in the invitation, then scroll a short row of choices (like the iOS lock screen)
       Gaya    one tap changes the whole look, from looks Nawala set up; colourways; "Kejutkan saya"
       Stiker  the only free placement, on a layer above the theme that cannot cover the guarded parts
     What a couple may change follows the order's level and what the team opened or closed for that order (Hak).
     Opened from the couple's room (?as=ruang&u=<address>) or the team console (?as=tim&u=<address>); with no
     address it runs on the sample couple and saves nothing (?tema=<slug> picks the theme). The design is the same
     draft.design the older editor (sunting.html) writes; guests see it only after the team publishes. -->
<div class="sky" aria-hidden="true"></div>

<header class="top glass">
  <a class="top__back" id="back" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg><span data-en="Back">Kembali</span></a>
  <div class="top__who"><b data-en="Theme studio">Studio tema</b><span id="who"></span></div>
  <div class="top__acts">
    <button type="button" class="ic" id="undo" aria-label="Urungkan" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7 4 11l4 4"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></svg></button>
    <button type="button" class="ic" id="redo" aria-label="Ulangi" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 7 4 4-4 4"/><path d="M20 11H10a5 5 0 0 0 0 10h3"/></svg></button>
    <span class="top__state" id="state" aria-live="polite"></span>
    <div class="seg seg--lang" role="group" aria-label="Bahasa"><button type="button" data-setlang="id">ID</button><button type="button" data-setlang="en">EN</button></div>
    <a class="btn btn--glow btn--sm" id="send" href="#"></a>
  </div>
</header>

<div class="demo glass" id="demo" hidden>
  <p class="demo__say" data-en="Sample couple. Nothing is saved. Try it as:">Pasangan contoh. Tidak ada yang tersimpan. Coba sebagai:</p>
  <div class="seg" id="demo-view" role="group"><button type="button" data-view="pasangan" data-en="Couple">Pasangan</button><button type="button" data-view="tim" data-en="Nawala team">Tim Nawala</button></div>
  <p class="demo__say" data-en="Level of the order:">Tingkat pesanan:</p>
  <div class="seg" id="demo-level" role="group"><button type="button" data-level="1">Dasar</button><button type="button" data-level="2" data-en="Middle">Menengah</button><button type="button" data-level="3" data-en="Full">Maksimal</button></div>
</div>

<main class="main">
  <section class="stage" aria-label="Pratinjau undangan">

  </section>

  <aside class="side glass" id="side">
    <button type="button" class="side__grip" id="grip" aria-label="Buka atau tutup panel"></button>
    <div class="side__head"><h1 id="sh"></h1><p id="sm"></p></div>
    <div class="side__body" id="body"></div>
    <nav class="modes" id="modes" aria-label="Cara mengubah">
      <button type="button" data-mode="sentuh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.500a1.500 1.500 0 0 1 3 0V11"/><path d="M12 10V8.500a1.500 1.500 0 0 1 3 0V11"/><path d="M15 10.500a1.500 1.500 0 0 1 3 0V15a6 6 0 0 1-6 6h-.500a6 6 0 0 1-5-2.700L4 14.500a1.500 1.500 0 0 1 2.500-1.600L9 15.500"/></svg><span data-en="Tap">Sentuh</span></button>
      <button type="button" data-mode="gaya"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.800 4.700L18.500 9.500l-4.700 1.800L12 16l-1.800-4.700L5.500 9.500l4.700-1.800z"/><path d="M18 15.500 18.800 18l2.200.800-2.200.800L18 22l-.800-2.400L15 18.800l2.200-.800z"/></svg><span data-en="Looks">Gaya</span></button>
      <button type="button" data-mode="stiker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v10l-6 6H4z"/><path d="M20 14h-6v6"/></svg><span data-en="Stickers">Stiker</span></button>
      <button type="button" data-mode="pembuka"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9 6 9-6"/><rect x="3" y="6" width="18" height="13" rx="2"/></svg><span data-en="Opening">Pembuka</span></button>
      <button type="button" data-mode="hak" id="mode-hak" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span data-en="Rights">Hak</span></button>
    </nav>
  </aside>
