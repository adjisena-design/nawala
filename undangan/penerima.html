<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFDFB">
<title>Penerima tamu, Nawala</title>
<link rel="stylesheet" href="denah.css?v=20261123w">
<style>
/* The ushers' page: ?u=<address>&k=<usher key> (made in the planner, Bagikan), or ?demo=1 (the seating demo's
   published plan from this browser; &embed=1 inside the demo, without its own sky). Type a name, see the table
   and its place on the published plan. Read-only, phone first, the couple's room look (denah.css?v=20261123w). */
body{overflow:auto;font-size:17px}
body.embed::before,body.embed::after{display:none}
body.embed{background:transparent}
.wrap{max-width:1120px;margin:0 auto;padding:14px;display:grid;gap:12px}
.head{display:flex;align-items:center;gap:12px;padding:12px 16px}
.head img{width:44px;height:44px;object-fit:contain}
.head h1{font-size:26px}
.head p{margin:2px 0 0;color:var(--mute);font-size:15px}
.find{padding:10px}
.find input{font-size:18px;min-height:54px;padding:10px 20px;border-radius:999px;background:#fff}
.grid{display:grid;gap:12px}
@media(min-width:860px){.grid{grid-template-columns:360px minmax(0,1fr);align-items:start}}
.list{padding:10px}
.res{max-height:60vh;overflow:auto}
.res button{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;min-height:58px;padding:10px 16px;border:0;border-radius:16px;background:rgba(255,255,255,.65)}
.res button[aria-pressed=true]{background:rgba(244,166,192,.35)}
.res small{display:block;color:var(--mute);font-size:14px}
.res b{white-space:nowrap;font-size:16px;font-family:var(--display);font-weight:560}
.show{padding:16px;display:grid;gap:10px}
.got{display:grid;gap:2px}
.got span{color:var(--mute);font-size:14px}
.got b{font-family:var(--display);font-weight:560;font-size:34px;line-height:1.05}
.plan{background:#fff;border-radius:18px;padding:8px}
.plan svg{width:100%;height:auto;max-height:66vh;display:block}
.msg{padding:26px;text-align:center;color:var(--mute);display:grid;gap:14px;justify-items:center}
.msg a{display:inline-flex;align-items:center;min-height:46px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:650;color:var(--forest);border:2px solid transparent;background:linear-gradient(var(--ivory),var(--ivory)) padding-box,conic-gradient(from var(--a),#F4A6C0,#F6C445,#D8436B,#F4A6C0) border-box;animation:dn-spin 5s linear infinite}
@media (prefers-reduced-motion:reduce){.msg a{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head g"><img src="../assets/img/nawala-hero-480.webp" width="480" height="413" alt=""><div><h1 id="h">Penerima tamu</h1><p id="sub"></p></div></header>
  <div class="find g"><input type="search" id="q" placeholder="Ketik nama tamu" autocomplete="off" aria-label="Nama tamu"></div>
  <div class="grid" id="grid">
    <div class="list g"><ul class="res" id="res"></ul></div>
    <div class="show g">
      <div class="got" id="got"></div>
      <div class="seg" id="tabs" hidden></div>
      <div class="plan" id="plan"></div>
    </div>
  </div>
</div>
<script src="../assets/js/db.js?v=20261122s"></script>
<script src="denah-lihat.js?v=20261122t"></script>
<script>
{
const EN=/[?&]lang=en\b/.test(location.search)||(()=>{try{return localStorage.getItem('nawala-lang')==='en'}catch(e){return false}})();
const t=(a,b)=>EN?b:a,$=s=>document.querySelector(s),V=window.NAWALA_DENAH,esc=V.esc;
const P={};try{new URLSearchParams(location.search).forEach((v,k)=>{P[k]=v})}catch(e){}
let D=null,pick=null,plan=0,seatOf={};
document.documentElement.lang=EN?'en':'id';
if(P.embed)document.body.classList.add('embed');
$('#q').placeholder=t('Ketik nama tamu','Type a guest\'s name');
function fail(m,demoLink){$('#h').textContent=t('Penerima tamu','Ushers');$('#sub').textContent='';$('.find').hidden=true;
 $('#grid').innerHTML='<div class="msg g"><span>'+esc(m)+'</span>'+(demoLink?'<a href="../demo/" target="_top">'+t('Coba demonya','Try the demo')+'</a>':'')+'</div>'}
function index(){seatOf={};D.plans.forEach((l,p)=>(l.items||[]).forEach(it=>{if(Array.isArray(it.seat))it.seat.forEach(v=>{if(!v)return;(seatOf[v]=seatOf[v]||[]);const e=seatOf[v].find(x=>x.it===it);if(e)e.n++;else seatOf[v].push({p,it,n:1})})}))}
function list(){const q=$('#q').value.trim().toLowerCase(),rows=D.guests.filter(g=>!q||g.name.toLowerCase().includes(q));
 $('#res').innerHTML=rows.length?rows.map(g=>{const s=seatOf[g.id]||[];return `<li><button data-g="${g.id}" aria-pressed="${pick===g.id}"><span>${esc(g.name)}<small>${g.party} ${t('orang','people')}${g.grp?', '+esc(g.grp):''}</small></span><b>${s.length?s.map(x=>esc(x.it.name)).join(', '):t('belum ada meja','no table')}</b></button></li>`}).join(''):`<li class="msg">${t('Nama tidak ditemukan.','No such name.')}</li>`}
function show(){const g=pick&&D.guests.find(x=>x.id===pick),s=g?(seatOf[g.id]||[]):[];if(s.length&&!s.some(x=>x.p===plan))plan=s[0].p;
 $('#got').innerHTML=g?(s.length?`<span>${esc(g.name)}</span><b>${s.map(x=>esc(x.it.name)+(D.plans.length>1?' ('+esc(D.plans[x.p].name)+')':'')).join(', ')}</b><span>${s.map(x=>x.n+' '+t('kursi','chairs')+'. '+V.where(D.plans[x.p],x.it,EN)).join(' / ')}</span>`:`<span>${esc(g.name)}</span><b style="font-size:24px">${t('Belum ada meja','No table yet')}</b>`):`<span>${t('Pilih nama untuk melihat mejanya di denah.','Pick a name to see their table on the plan.')}</span><b style="font-size:24px">${esc(D.couple)}</b>`;
 const tb=$('#tabs');tb.hidden=D.plans.length<2;tb.innerHTML=D.plans.map((l,i)=>`<button data-p="${i}" aria-pressed="${i===plan}">${esc(l.name)}</button>`).join('');
 const hit=s.find(x=>x.p===plan),colors={};(D.groups||[]).forEach(x=>colors[x.name]=x.color);const byId={};D.guests.forEach(x=>byId[x.id]=x);
 $('#plan').innerHTML=D.plans[plan]?V.svg(D.plans[plan],{hl:hit&&hit.it.id,mine:pick,colors,guests:byId}):''}
$('#q').addEventListener('input',list);
$('#res').addEventListener('click',e=>{const b=e.target.closest('[data-g]');if(!b)return;pick=b.dataset.g;list();show();if(innerWidth<860)$('.show').scrollIntoView({behavior:'smooth',block:'start'})});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){plan=+b.dataset.p;show()}});
function go(d){D=d;$('#h').textContent=d.couple;$('#sub').textContent=P.demo?t('Demo penerima tamu: cari nama, lihat mejanya.','Ushers demo: find a name, see the table.'):t('Penerima tamu: cari nama, lihat mejanya.','Ushers: find a name, see the table.');document.title=t('Penerima tamu, ','Ushers, ')+d.couple;index();list();show()}
if(P.demo){let d=null;try{d=JSON.parse(localStorage.getItem('nawala-denah-demo')||'null')}catch(e){}
 if(d&&d.plans)go(d);else fail(t('Demo ini dibuka dari demo denah Nawala.','This demo opens from the Nawala seating demo.'),true)}
else if(!P.u||!P.k)fail(t('Tautan ini tidak lengkap. Minta tautan penerima tamu dari pasangan atau tim Nawala.','This link is incomplete. Ask the couple or the Nawala team for the ushers\' link.'),true);
else window.NAWALA_DB.rpc('usher_data',{p_slug:P.u,p_key:P.k}).then(d=>{if(!d)return fail(t('Tautan ini tidak berlaku lagi, atau denahnya belum diterbitkan.','This link no longer works, or the plan is not published yet.'),true);go(d)},
 ()=>fail(t('Database Nawala tidak terjangkau. Periksa sambungan, lalu muat ulang.','The Nawala database is out of reach. Check the connection, then reload.')));
}
</script>
</body>
</html>
